services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appointment_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment_booking"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - appointment-booking-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/AppointmentBooking.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BookingDatabase: Host=postgres;Port=5432;Database=appointment_booking;Username=postgres;Password=postgres
      Database__ApplyMigrations: "true"
    ports:
      - "5180:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  appointment-booking-postgres:
